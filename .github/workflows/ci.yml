name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Typecheck (published line)
        run: pnpm run typecheck:ci
      - run: pnpm run test
      - run: pnpm run test:coverage
      - run: pnpm run lint
      - run: pnpm run check:readmes
      - run: pnpm run build
      # The git channel installs the committed `lib/`: pnpm >=10 never runs a
      # dependency's build scripts (the allow-list key is the resolved commit
      # sha), so the checked-in build is what a GitHub install ships. The build
      # above just ran, so the committed output must be byte-identical.
      - name: Committed lib is current
        run: |
          git ls-files --error-unmatch lib/index.js lib/client.js >/dev/null
          git diff --exit-code -- lib
      - run: pnpm run verify:self-contained
      - run: pnpm run verify:artifacts
